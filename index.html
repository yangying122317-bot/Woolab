    <!--
      开场要用的东西提前下：不等 JS 跑起来再去请求。
      电视机两张图先出；字体和首页底图开场加载页反正要等它们，越早开始越好。
      字体 URL 要和 index.css 里 @font-face 写的一模一样（含 ?v=），不然浏览器会当成两份文件下两遍。
    -->
    <link rel="preload" as="image" href="/assets/hero-loading-tv.png" />
    <link rel="preload" as="image" href="/assets/hero-loading-tv-frame.png" />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/dm-sans.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/sans-zh.woff2?v=20260919c" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/hand-zh.woff2?v=20260919c" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/scroll-hand.woff2" crossorigin />
    <link rel="preload" as="image" href="/assets/hero-base.webp" />
